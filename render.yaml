databases:
  - name: movie_theater_db
    plan: free
    databaseName: movie_booking

services:
  - type: web
    plan: free
    name: movie_booking
    runtime: python
    buildCommand: './build.sh'
    startCommand: "cd homework2 && python -m gunicorn movie_booking.wsgi:application"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: movie_theater_db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: WEB_CONCURRENCY
        value: 4
